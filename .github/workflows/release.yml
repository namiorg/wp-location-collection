name: Create WordPress Plugin Release

on:
  push:
    tags:
      - '*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3). Creates and pushes the tag v<version>.'
        required: true
        type: string

jobs:
  build:
    name: Build and Upload Release Asset
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to upload release assets

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual run: take the version from the input. The tag itself is created by the
            # "Upload release asset" step (tag_name below) so we don't trigger a second run.
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          else
            # Tag push / release: derive the version from the ref.
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "Version: ${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Get plugin slug
        id: slug
        run: |
          PLUGIN_SLUG=$(basename $(pwd))
          echo "slug=${PLUGIN_SLUG}" >> $GITHUB_OUTPUT
          echo "Plugin slug: ${PLUGIN_SLUG}"

      - name: Update version in plugin file
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Version: ${VERSION}"

          # Replace {{VERSION}} placeholder in plugin file
          sed -i "s/{{VERSION}}/${VERSION}/g" wp-location-collection.php

          # Verify the replacement
          echo "Updated plugin file:"
          grep "* Version:" wp-location-collection.php
          grep "const string VERSION" wp-location-collection.php

      - name: Create plugin zip
        run: |
          PLUGIN_SLUG="${{ steps.slug.outputs.slug }}"

          # Create temporary directory for the plugin
          mkdir -p /tmp/plugin-build/${PLUGIN_SLUG}

          # Copy all files
          rsync -av --progress . /tmp/plugin-build/${PLUGIN_SLUG}/ \
            --exclude-from=".distignore"

          # Create zip file
          cd /tmp/plugin-build
          zip -r ${PLUGIN_SLUG}.zip ${PLUGIN_SLUG}

          # Move zip to workspace
          mv ${PLUGIN_SLUG}.zip ${GITHUB_WORKSPACE}/

          echo "Created ${PLUGIN_SLUG}.zip"
          ls -lh ${GITHUB_WORKSPACE}/${PLUGIN_SLUG}.zip

      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          # On a manual run github.ref is a branch, so target the tag we created in "Resolve version".
          tag_name: v${{ steps.version.outputs.version }}
          files: ${{ steps.slug.outputs.slug }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
